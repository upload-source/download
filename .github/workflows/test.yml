name: Test download
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: write
    steps:
      - name: start test
        run: |
          wget "https://www.cgsecurity.org/testdisk-7.3-WIP.win64.zip"
      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Test
          path: ./*.zip
          if-no-files-found: error 
