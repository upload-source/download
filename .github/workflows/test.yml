name: Test download
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-24.04-arm
    steps:
      - name: start test
        run: |
          wget "https://dn11.dailyuploads.net/d/yico5vriofuuxiqna5fkaecpbysq6mchb5yyihvswgne24x5c3y2zpmsca7an2lgdryxeq3pgcouv7y/L.age.de.glace.3.French.Dvdip.XviD.--Wawacity.GRATIS.avi"
          sudo apt install ffmpeg
          ffmpeg -i *.avi -c:v libx264 -c:a aac -preset fast test.mp4
      - name: release test
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: test
          name: result test
          body: |
            Utils for cuttlefish
          files:  test.mp4 
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}   
